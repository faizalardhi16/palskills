<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palskills Engine Dashboard</title>
<style>
:root {
  --bg: #0a0e17;
  --surface: #111827;
  --border: #1e293b;
  --text: #e2e8f0;
  --muted: #64748b;
  --accent: #3b82f6;
  --green: #22c55e;
  --yellow: #f59e0b;
  --red: #ef4444;
  --purple: #a855f7;
  --cyan: #06b6d4;
  --orange: #f97316;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; overflow:hidden; height:100vh; }
#app { display:grid; grid-template-columns:280px 1fr 300px; grid-template-rows:auto 1fr auto; height:100vh; gap:1px; background:var(--border); }

#header { grid-column:1/-1; background:var(--surface); padding:12px 20px; display:flex; align-items:center; gap:16px; border-bottom:1px solid var(--border); }
#header h1 { font-size:18px; font-weight:700; background:linear-gradient(135deg,var(--accent),var(--purple)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
#header .dot { width:8px; height:8px; border-radius:50%; background:var(--green); animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
#header .status { font-size:12px; color:var(--muted); }

#sidebar { background:var(--surface); padding:16px; overflow-y:auto; }
#sidebar h2 { font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:12px; }
.skill-card { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:8px; display:flex; align-items:center; gap:10px; transition:all .2s; }
.skill-card.inprogress { border-color:var(--accent); box-shadow:0 0 12px rgba(59,130,246,.15); }
.skill-card.done { border-color:var(--green); opacity:.7; }
.skill-card.error { border-color:var(--red); }
.skill-card .icon { width:28px; height:28px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:14px; }
.skill-card .icon.star { background:rgba(168,85,247,.15); color:var(--purple); }
.skill-card .icon.fire { background:rgba(249,115,22,.15); color:var(--orange); }
.skill-card .icon.bolt { background:rgba(34,197,94,.15); color:var(--green); }
.skill-card .icon.wave { background:rgba(6,182,212,.15); color:var(--cyan); }
.skill-card .icon.quill { background:rgba(245,158,11,.15); color:var(--yellow); }
.skill-card .info { flex:1; }
.skill-card .name { font-size:13px; font-weight:600; }
.skill-card .state { font-size:11px; color:var(--muted); }
.skill-card .badge { font-size:10px; padding:2px 6px; border-radius:4px; }
.badge.inprogress { background:rgba(59,130,246,.15); color:var(--accent); }
.badge.done { background:rgba(34,197,94,.15); color:var(--green); }
.badge.error { background:rgba(239,68,68,.15); color:var(--red); }
.badge.idle { background:rgba(100,116,139,.1); color:var(--muted); }

#main { background:var(--surface); padding:20px; overflow-y:auto; display:flex; flex-direction:column; gap:16px; }
#flow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.flow-step { padding:6px 12px; border-radius:20px; font-size:12px; font-weight:500; border:1px solid var(--border); }
.flow-arrow { color:var(--muted); }
#output { flex:1; background:var(--bg); border-radius:8px; padding:16px; font-family:'JetBrains Mono',monospace; font-size:12px; overflow-y:auto; white-space:pre-wrap; color:var(--muted); min-height:200px; }
#output .timestamp { color:var(--muted); }
#output .skill-name { color:var(--accent); font-weight:600; }

#right { background:var(--surface); padding:16px; overflow-y:auto; }
#right h2 { font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:12px; }
.stat { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
.stat .val { font-weight:600; color:var(--accent); }
#history { margin-top:16px; }
.history-item { padding:8px 0; border-bottom:1px solid var(--border); font-size:12px; }
.history-item .date { color:var(--muted); font-size:10px; }

@media (max-width:900px) { #app { grid-template-columns:1fr; grid-template-rows:auto auto 1fr; } #sidebar,#right { display:none; } }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>🔮 Palskills Engine</h1>
    <div class="dot" id="status-dot"></div>
    <span class="status" id="status-text">connecting...</span>
    <span style="flex:1"></span>
    <span style="font-size:12px;color:var(--muted)">State.md</span>
  </div>

  <div id="sidebar">
    <h2>🔧 Skills</h2>
    <div id="skills-list"></div>
  </div>

  <div id="main">
    <div id="flow"></div>
    <div id="output">[palskills] Connecting to dashboard...</div>
  </div>

  <div id="right">
    <h2>📊 Stats</h2>
    <div class="stat"><span>Tools loaded</span><span class="val">6</span></div>
    <div class="stat"><span>Palbox nodes</span><span class="val" id="stat-nodes">—</span></div>
    <div class="stat"><span>CBM symbols</span><span class="val" id="stat-symbols">—</span></div>
    <div class="stat"><span>CBM files</span><span class="val" id="stat-files">—</span></div>
    <div class="stat"><span>Confidence</span><span class="val" id="stat-confidence">—</span></div>
    <div id="history"><h2>📜 History</h2><div id="history-list"></div></div>
  </div>
</div>

<script>
const skills = [
  { name:'orchestrate', label:'Astralym', icon:'⭐', color:'star', desc:'CBM-aware flow detection' },
  { name:'write_docs', label:'Katress', icon:'🖋️', color:'quill', desc:'Documentation-first gate' },
  { name:'scan_context', label:'Lyleen', icon:'🔍', color:'wave', desc:'CBM code search' },
  { name:'dispatch', label:'Anubis', icon:'⚡', color:'bolt', desc:'Agent execution (SOLID)' },
  { name:'run_tests', label:'Verdash', icon:'🧪', color:'bolt', desc:'Test runner' },
  { name:'record_session', label:'Panthalus', icon:'📝', color:'wave', desc:'Session persistence' }
];

let ws;

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = e => handleEvent(JSON.parse(e.data));
  ws.onclose = () => {
    document.getElementById('status-dot').style.background='var(--red)';
    document.getElementById('status-text').textContent='disconnected';
    setTimeout(connect,2000);
  };
}

function handleEvent(e) {
  const out = document.getElementById('output');
  const ts = new Date().toLocaleTimeString();

  // Full state snapshot from State.md on connect
  if (e.event === 'state_snapshot' && e.state) {
    document.getElementById('status-text').textContent = 'connected';
    document.getElementById('status-dot').style.background = 'var(--green)';

    if (e.state.skills) e.state.skills.forEach(s => updateSkill(s.skill, s.status, s.duration_ms));
    if (e.flow) renderFlow(e.flow);

    if (e.state.stats_nodes != null) document.getElementById('stat-nodes').textContent = e.state.stats_nodes;
    if (e.state.stats_symbols != null) document.getElementById('stat-symbols').textContent = e.state.stats_symbols;
    if (e.state.stats_files != null) document.getElementById('stat-files').textContent = e.state.stats_files;
    if (e.confidence != null) document.getElementById('stat-confidence').textContent = e.confidence + '%';

    if (e.state.task) {
      out.innerHTML += `\n<span class="timestamp">${ts}</span> 📋 <b>Task:</b> ${e.state.task}`;
      out.scrollTop = out.scrollHeight;
    }
    out.innerHTML += `\n<span class="timestamp">${ts}</span> ✅ State loaded from .palbox/State.md`;
    out.scrollTop = out.scrollHeight;
    return;
  }

  if (e.stats_nodes != null) document.getElementById('stat-nodes').textContent = e.stats_nodes;
  if (e.stats_symbols != null) document.getElementById('stat-symbols').textContent = e.stats_symbols;
  if (e.stats_files != null) document.getElementById('stat-files').textContent = e.stats_files;
  if (e.confidence != null) document.getElementById('stat-confidence').textContent = e.confidence + '%';

  if (e.skill) updateSkill(e.skill, e.status || 'inprogress', e.duration_ms);
  if (e.flow) renderFlow(e.flow);

  if (e.message) {
    const skillTag = e.skill ? `<span class="skill-name">[${e.skill}]</span> ` : '';
    const icon = e.status === 'done' ? '✅' : e.status === 'error' ? '❌' : e.status === 'inprogress' ? '🔄' : '';
    const dur = e.duration_ms ? ` <span style="color:var(--muted)">(${e.duration_ms}ms)</span>` : '';
    out.innerHTML += `\n<span class="timestamp">${ts}</span> ${icon}${skillTag}${e.message}${dur}`;
    out.scrollTop = out.scrollHeight;
  }

  if (e.event === 'tool_done' && e.skill) addHistory(`✅ ${e.skill.replace(/_/g,' ')} — ${e.message||''}`);
}

function addHistory(text) {
  const list = document.getElementById('history-list');
  const ts = new Date().toLocaleTimeString();
  list.innerHTML = `<div class="history-item"><span class="date">${ts}</span> ${text}</div>` + list.innerHTML;
  const items = list.querySelectorAll('.history-item');
  for (let i = 20; i < items.length; i++) items[i].remove();
}

function updateSkill(name, status, duration) {
  const card = document.getElementById(`skill-${name}`);
  if (!card) return;
  const badge = card.querySelector('.badge');
  card.className = `skill-card ${status}`;
  badge.className = `badge ${status}`;
  badge.textContent = status === 'inprogress' ? 'ACTIVE' : status === 'done' ? (duration ? `✓ ${duration}ms` : '✓ DONE') : status === 'error' ? 'ERROR' : 'IDLE';
  card.querySelector('.state').textContent = status === 'inprogress' ? 'Running...' : status === 'done' ? 'Done' : status === 'error' ? 'Failed' : 'Waiting';
}

function renderFlow(flow) {
  const el = document.getElementById('flow');
  el.innerHTML = flow.map((s,i) => `<span class="flow-step">${s.replace(/_/g,' ')}</span>${i<flow.length-1?'<span class="flow-arrow">→</span>':''}`).join('');
}

// Init sidebar
skills.forEach(s => {
  document.getElementById('skills-list').innerHTML += `
    <div class="skill-card" id="skill-${s.name}">
      <div class="icon ${s.color}">${s.icon}</div>
      <div class="info">
        <div class="name">${s.label}</div>
        <div class="state">Waiting</div>
      </div>
      <span class="badge idle">IDLE</span>
    </div>`;
});

connect();
</script>
</body>
</html>
