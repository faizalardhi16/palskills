[package]
name = "palskills-engine"
version = "3.4.0"
edition = "2021"
description = "Palskills Engine — CBM-aware MCP orchestration with 5 tools. Slim dispatch (SOLID contract gate, no subprocess). Advisory planning merged into orchestrate. Fast scan_context (skips deep grep when no CBM)."

[[bin]]
name = "palskills-engine"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }
rmcp = { version = "3.0.0-beta.2", features = ["server", "transport-async-rw"] }
schemars = "1"
walkdir = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.7", features = ["ws"] }
axum-extra = { version = "0.9", features = ["cookie"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
