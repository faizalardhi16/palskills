[package]
name = "palskills"
version = "0.1.0"
edition = "2021"
description = "Palskills Engine — MCP orchestration engine for AI development pipeline. Astralym, Jetdragon, Anubis, and all 11 skills as MCP tools."

[[bin]]
name = "palskills"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }
rmcp = { version = "3.0.0-beta.2", features = ["server", "transport-async-rw"] }
schemars = "1"
walkdir = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
